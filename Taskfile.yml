# Taskfile for Engram development
# Install: go install github.com/go-task/task/v3/cmd/task@latest
# Usage: task <command>
# https://taskfile.dev/

version: "3"

vars:
  APP_NAME: Engram
  APP_ID: com.engram.wallet
  VERSION:
    sh: git describe --tags --always 2>/dev/null | sed 's/^v//' || echo "0.0.0-dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_TAGS: migrated_fynedo
  BINARY: engram
  LDFLAGS: -X main.versionString={{.VERSION}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ==================== Development ====================

  build:
    desc: Build the application
    cmds:
      - go build -v -tags {{.BUILD_TAGS}} -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}} .
    sources:
      - "*.go"
      - go.mod
      - go.sum
    generates:
      - bin/{{.BINARY}}

  run:
    desc: Build and run the application
    deps: [build]
    cmds:
      - ./bin/{{.BINARY}}

  test:
    desc: Run tests with race detector
    cmds:
      - go test -v -race -tags {{.BUILD_TAGS}} -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
    generates:
      - coverage.out
      - coverage.html

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run --timeout=5m

  lint-fix:
    desc: Run linters and fix issues
    cmds:
      - golangci-lint run --fix --timeout=5m

  fmt:
    desc: Format code
    cmds:
      - gofmt -w -s $(find . -name "*.go" -not -path "./vendor/*" -not -name "bundled*")
      - goimports -w $(find . -name "*.go" -not -path "./vendor/*" -not -name "bundled*")

  tidy:
    desc: Tidy go modules
    cmds:
      - go mod tidy
      - go mod verify

  # ==================== Security ====================

  security:
    desc: Run all security checks
    cmds:
      - task: govulncheck
      - task: gosec
      - task: gitleaks
      - task: trivy
      - task: semgrep

  govulncheck:
    desc: Check for known vulnerabilities
    cmds:
      - govulncheck -tags {{.BUILD_TAGS}} ./...

  gosec:
    desc: Run Go security scanner
    cmds:
      - gosec -tags {{.BUILD_TAGS}} ./...

  gitleaks:
    desc: Scan for secrets
    cmds:
      - gitleaks detect --source . --verbose

  trivy:
    desc: Run Trivy filesystem scan
    cmds:
      - trivy fs --severity CRITICAL,HIGH --ignorefile .trivyignore .

  semgrep:
    desc: Run Semgrep security analysis
    cmds:
      - semgrep --config auto --severity ERROR --severity WARNING .

  sbom:
    desc: Generate Software Bill of Materials (SBOM)
    cmds:
      - mkdir -p dist
      - syft packages dir:. -o spdx-json > dist/sbom.spdx.json

  sign:
    desc: Sign artifacts with Cosign
    cmds:
      - |
        for file in dist/*.tar.xz dist/*.tar.gz dist/*.exe dist/*.apk; do
          if [ -f "$file" ]; then
            cosign sign-blob --yes "$file" --bundle "${file}.bundle"
          fi
        done

  verify-signatures:
    desc: Verify signed artifacts
    cmds:
      - |
        for file in dist/*.tar.xz dist/*.tar.gz dist/*.exe dist/*.apk; do
          if [ -f "$file" ] && [ -f "${file}.bundle" ]; then
            cosign verify-blob "$file" --bundle "${file}.bundle"
          fi
        done

  checksums:
    desc: Generate SHA256 checksums
    cmds:
      - |
        cd dist && sha256sum * > SHA256SUMS.txt

  # ==================== Packaging ====================

  package-linux:
    desc: Package for Linux
    env:
    cmds:
      - fyne package --target linux --name {{.APP_NAME}} --app-version {{.VERSION}} --icon Icon.png --tags {{.BUILD_TAGS}} --metadata versionString={{.VERSION}}
      - mv {{.APP_NAME}}.tar.xz dist/{{.BINARY}}-{{.VERSION}}-linux-amd64.tar.xz
    generates:
      - dist/{{.BINARY}}-{{.VERSION}}-linux-amd64.tar.xz

  package-windows:
    desc: Package for Windows
    env:
    cmds:
      - fyne package --target windows --name {{.APP_NAME}} --app-version {{.VERSION}} --icon Icon.png --tags {{.BUILD_TAGS}} --metadata versionString={{.VERSION}}
      - mv {{.APP_NAME}}.exe dist/{{.BINARY}}-{{.VERSION}}-windows-amd64.exe
    generates:
      - dist/{{.BINARY}}-{{.VERSION}}-windows-amd64.exe

  package-macos:
    desc: Package for macOS (native architecture)
    env:
    cmds:
      - fyne package --target darwin --name {{.APP_NAME}} --app-version {{.VERSION}} --app-id {{.APP_ID}} --icon Icon.png --tags {{.BUILD_TAGS}} --metadata versionString={{.VERSION}}
      - ./fix_macos_permissions.sh {{.APP_NAME}}.app
      - tar -czvf dist/{{.BINARY}}-{{.VERSION}}-macos-$(uname -m | sed 's/x86_64/amd64/').tar.gz {{.APP_NAME}}.app
      - mv {{.APP_NAME}}.app ~/Applications/{{.APP_NAME}}.app

  package-macos-arm64:
    desc: Package for macOS Apple Silicon
    env:
      GOOS: darwin
      GOARCH: arm64
    cmds:
      - fyne package --target darwin --name {{.APP_NAME}} --app-version {{.VERSION}} --app-id {{.APP_ID}} --icon Icon.png --tags {{.BUILD_TAGS}} --metadata versionString={{.VERSION}}
      - ./fix_macos_permissions.sh {{.APP_NAME}}.app
      - tar -czvf dist/{{.BINARY}}-{{.VERSION}}-macos-arm64.tar.gz {{.APP_NAME}}.app
    generates:
      - dist/{{.BINARY}}-{{.VERSION}}-macos-arm64.tar.gz

  package-macos-amd64:
    desc: Package for macOS Intel
    env:
      GOOS: darwin
      GOARCH: amd64
    cmds:
      - fyne package --target darwin --name {{.APP_NAME}} --app-version {{.VERSION}} --app-id {{.APP_ID}} --icon Icon.png --tags {{.BUILD_TAGS}} --metadata versionString={{.VERSION}}
      - ./fix_macos_permissions.sh {{.APP_NAME}}.app
      - tar -czvf dist/{{.BINARY}}-{{.VERSION}}-macos-amd64.tar.gz {{.APP_NAME}}.app
    generates:
      - dist/{{.BINARY}}-{{.VERSION}}-macos-amd64.tar.gz

  package-android:
    desc: Package for Android
    deps: [patch-android, build-fyne]
    env:
    cmds:
      - ./bin/fyne-custom package --target android/arm64 --name {{.APP_NAME}} --app-version {{.VERSION}} --app-id {{.APP_ID}} --icon Icon.png --tags {{.BUILD_TAGS}} --metadata versionString={{.VERSION}}
      - mv {{.APP_NAME}}.apk dist/{{.BINARY}}-{{.VERSION}}-android-arm64.apk
    generates:
      - dist/{{.BINARY}}-{{.VERSION}}-android-arm64.apk

  build-fyne:
    desc: Build custom Fyne CLI with QR scanner support
    cmds:
      - ./build_fyne_custom.sh
    generates:
      - bin/fyne-custom

  patch-android:
    desc: Patch Fyne source (Module cache and Vendor if present)
    cmds:
      - ./patch_fyne.sh
      - |
        if [ -d "vendor/fyne.io/fyne/v2" ]; then
          echo "Patching vendor directory..."
          cp internal/patches/android/* vendor/fyne.io/fyne/v2/internal/driver/mobile/app/
          echo "✅ Vendor directory patched."
        fi

  package-all:
    desc: Package for all platforms (requires cross-compilation setup)
    deps: [clean-dist]
    cmds:
      - mkdir -p dist
      - task: package-linux
      - task: package-windows
      - task: package-macos-arm64
      - task: package-macos-amd64
      - task: package-android

  release:
    desc: Build and sign release artifacts locally
    deps: [clean-dist]
    cmds:
      - mkdir -p dist
      - task: tidy
      - task: lint
      - task: security
      - task: test
      - task: package-linux
      - task: package-windows
      - task: package-macos-arm64
      - task: package-macos-amd64
      - task: package-android
      - task: sbom
      - task: sign
      - task: checksums

  # ==================== CI/CD Helpers ====================

  check:
    desc: Run all checks (format, lint, security, test)
    cmds:
      - task: fmt
      - task: lint
      - task: security
      - task: test
      - task: check-conventional

  check-conventional:
    desc: Validate conventional commit format for last commit
    cmds:
      - |
        MSG=$(git log -1 --pretty=format:"%s")
        if ! echo "$MSG" | grep -qE "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .{1,}"; then
          echo "Commit message does not follow conventional commits format:"
          echo "$MSG"
          echo ""
          echo "Format: type(scope): description"
          echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          exit 1
        fi
        echo "✓ Commit message follows conventional format"

  ci:
    desc: Run CI pipeline locally
    cmds:
      - task: tidy
      - task: lint
      - task: build
      - task: test

  changelog:
    desc: Generate changelog
    cmds:
      - git-cliff -o CHANGELOG.md

  # ==================== Cleanup ====================

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
      - rm -f coverage.out coverage.html
      - rm -f {{.BINARY}} {{.BINARY}}.exe
      - rm -f *.apk *.tar.xz *.tar.gz
      - rm -rf {{.APP_NAME}}.app

  clean-dist:
    desc: Clean distribution artifacts
    cmds:
      - rm -rf dist/

  clean-all:
    desc: Clean all artifacts
    deps: [clean, clean-dist]

  # ==================== Setup ====================

  fyne-deps:
    desc: Install Fyne system dependencies (Linux/Debian)
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y libgl1-mesa-dev xorg-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libegl1-mesa-dev libgles2-mesa-dev

  setup:
    desc: Install development tools
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - go install fyne.io/fyne/v2/cmd/fyne@latest
      - go install github.com/orhun/git-cliff/cmd/git-cliff@latest
      - echo "Install gitleaks from https://github.com/gitleaks/gitleaks/releases"
      - echo "Install Trivy from https://github.com/aquasecurity/trivy/releases"
      - echo "Install Syft from https://github.com/anchore/syft/releases"
      - echo "Install Cosign from https://github.com/sigstore/cosign/releases"
      - 'echo "Install Semgrep: pip install semgrep"'
      - 'echo "Install pre-commit: pip install pre-commit"'

  setup-hooks:
    desc: Install git hooks
    cmds:
      - pre-commit install
      - pre-commit install --hook-type commit-msg

  version:
    desc: Show version information
    cmds:
      - echo "App Version:" {{.VERSION}}
      - go version
      - golangci-lint --version || true
      - fyne version || true
