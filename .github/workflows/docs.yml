name: Documentation

on:
  push:
    paths:
      - "**.md"
      - ".markdownlint.json"
  pull_request:
    paths:
      - "**.md"
      - ".markdownlint.json"
  workflow_dispatch:

permissions: read-all

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@eb4d60e5d07a423d00f9c3078a9ee202a3e2a3ad # v19.1.0
        with:
          globs: "**/*.md"
          config: ".markdownlint.json"

  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@1170ef8fc10519f56e3fee1196a4e615f195f3c0 # v1.0.15
        with:
          use-quiet-mode: "yes"
          config-file: ".markdown-link-check.json"

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check spelling
        uses: crate-ci/typos@b74202f74b7c7f19396ef4d19051ed1df5c6a193 # v1.29.4
        with:
          config: .typos.toml
