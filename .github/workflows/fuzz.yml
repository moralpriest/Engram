name: Fuzz Testing

on:
  schedule:
    - cron: "0 3 * * 0" # Weekly on Sunday at 3 AM
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Fuzz duration per target (e.g., 30s, 5m)"
        required: false
        default: "60s"
        type: string

permissions: read-all

env:
  GO_VERSION: "1.24"

jobs:
  fuzz:
    name: Go Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Fyne dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev

      - name: Get fuzz time
        id: fuzz_time
        env:
          FUZZ_TIME: ${{ inputs.fuzz_time }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "duration=${FUZZ_TIME:-60s}" >> $GITHUB_OUTPUT
          else
            echo "duration=60s" >> $GITHUB_OUTPUT
          fi

      - name: List fuzz targets
        id: targets
        run: |
          TARGETS=$(go test -list 'Fuzz.*' -tags migrated_fynedo ./... 2>/dev/null | grep '^Fuzz' || echo "")
          echo "Found fuzz targets: $TARGETS"
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT

      - name: Run fuzz tests
        run: |
          FUZZ_TIME="${{ steps.fuzz_time.outputs.duration }}"
          echo "Running fuzz tests for $FUZZ_TIME each"

          # Get all fuzz targets
          TARGETS=$(go test -list 'Fuzz.*' -tags migrated_fynedo ./... 2>/dev/null | grep '^Fuzz' || echo "")

          if [ -z "$TARGETS" ]; then
            echo "No fuzz targets found"
            exit 0
          fi

          FAILED=0
          for target in $TARGETS; do
            echo ""
            echo "=========================================="
            echo "Fuzzing: $target"
            echo "=========================================="
            if ! go test -fuzz="^${target}$" -fuzztime="$FUZZ_TIME" -tags migrated_fynedo ./... 2>&1; then
              echo "FAILED: $target"
              FAILED=1
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "Some fuzz tests found issues!"
            exit 1
          fi

          echo ""
          echo "All fuzz tests passed!"

      - name: Upload crash artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: failure()
        with:
          name: fuzz-crashes
          path: |
            **/testdata/fuzz/**/
          retention-days: 30
