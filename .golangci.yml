# golangci-lint configuration for Engram
# https://golangci-lint.run/usage/configuration/
# Config format: v2

version: "2"

run:
  timeout: 5m
  build-tags:
    - migrated_fynedo
  exclude-dirs:
    - vendor
  exclude-files:
    - "bundled.*\\.go$"

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true

linters:
  default: none
  enable:
    - gosimple
    - govet
    - ineffassign
    - unused
    - misspell
    - bodyclose
    - nilerr
    - nilnil
    - revive

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    misspell:
      locale: US

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
          disabled: true
        - name: var-naming
          disabled: true
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
          disabled: true
        - name: indent-error-flow
          disabled: true
        - name: errorf
        - name: empty-block
          disabled: true
        - name: superfluous-else
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: unreachable-code
        - name: redefines-builtin-id

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
